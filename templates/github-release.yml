# Manufacturing release workflow for KiCad projects (GitHub Actions).
#
# Generated by KiForge (templates/github-release.yml). Placeholders:
#   {{OUTPUT_DIR}}          — export folder relative to project_path
#   {{EXPORT_*}}            — per-output toggles ('true' / 'false')
#   {{FORMAT_JLC}}          — JLCPCB CSV formatting toggle
#   {{KIFORGE_ACTION_REF}}  — composite action ref (default: alphaseneca/kiforge@main)
#   {{GITHUB_REF_NAME}}     — substituted to ${{ github.ref_name }} at generation time
#
# On tag push, KiForge exports versioned files to {{OUTPUT_DIR}}/ and this workflow
# uploads them as GitHub Release assets. Nothing is committed to the repository.
name: Manufacturing Release (GitHub)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiForge
        uses: {{KIFORGE_ACTION_REF}}
        with:
          project_path: '.'
          output_dir: '{{OUTPUT_DIR}}'
          export_3d: '{{EXPORT_3D}}'
          export_svg: '{{EXPORT_SVG}}'
          export_bom: '{{EXPORT_BOM}}'
          export_sch_pdf: '{{EXPORT_SCH_PDF}}'
          export_pos: '{{EXPORT_POS}}'
          export_step: '{{EXPORT_STEP}}'
          export_gerbers: '{{EXPORT_GERBERS}}'
          export_drills: '{{EXPORT_DRILLS}}'
          export_ibom: '{{EXPORT_IBOM}}'
          format_jlc: '{{FORMAT_JLC}}'

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: {{GITHUB_REF_NAME}}
          generate_release_notes: true
          files: {{OUTPUT_DIR}}/*
