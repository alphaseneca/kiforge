# Manufacturing release workflow for KiCad projects (GitHub Actions).
# Generated by KiForge (templates/github-release.yml). 

name: Manufacturing Release (GitHub)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiForge
        uses: {{KIFORGE_ACTION_REF}}
        with:
          project_path: '.'
          output_dir: '{{OUTPUT_DIR}}'
          export_3d: '{{EXPORT_3D}}'
          export_svg: '{{EXPORT_SVG}}'
          export_bom: '{{EXPORT_BOM}}'
          export_sch_pdf: '{{EXPORT_SCH_PDF}}'
          export_pos: '{{EXPORT_POS}}'
          export_step: '{{EXPORT_STEP}}'
          export_gerbers: '{{EXPORT_GERBERS}}'
          export_drills: '{{EXPORT_DRILLS}}'
          export_ibom: '{{EXPORT_IBOM}}'
          format_jlc: '{{FORMAT_JLC}}'
          pos_side: '{{POS_SIDE}}'
          pos_smd_only: '{{POS_SMD_ONLY}}'
          pos_exclude_dnp: '{{POS_EXCLUDE_DNP}}'
          step_subst_models: '{{STEP_SUBST_MODELS}}'
          bom_include_mfr_mpn: '{{BOM_INCLUDE_MFR_MPN}}'
          sync_title_block_rev: '{{SYNC_TITLE_BLOCK_REV}}'

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: {{GITHUB_REF_NAME}}
          generate_release_notes: true
          files: {{OUTPUT_DIR}}/*
          overwrite: true
          overwrite_files: true
