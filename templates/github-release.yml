# Manufacturing release workflow for KiCad projects (GitHub Actions).
# Generated by KiForge (templates/github-release.yml). 

name: Manufacturing Release (GitHub)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run KiForge
        uses: {{KIFORGE_ACTION_REF}}
        with:
          project-path: '.'
          output-dir: '{{OUTPUT_DIR}}'
          export-3d: '{{EXPORT_3D}}'
          export-svg: '{{EXPORT_SVG}}'
          export-homebrew-pdf: '{{EXPORT_HOMEBREW_PDF}}'
          export-bom: '{{EXPORT_BOM}}'
          export-sch-pdf: '{{EXPORT_SCH_PDF}}'
          export-pos: '{{EXPORT_POS}}'
          export-step: '{{EXPORT_STEP}}'
          export-gerbers: '{{EXPORT_GERBERS}}'
          export-drills: '{{EXPORT_DRILLS}}'
          export-ibom: '{{EXPORT_IBOM}}'
          format-jlc: '{{FORMAT_JLC}}'
          pos-side: '{{POS_SIDE}}'
          pos-smd-only: '{{POS_SMD_ONLY}}'
          pos-exclude-dnp: '{{POS_EXCLUDE_DNP}}'
          step-subst-models: '{{STEP_SUBST_MODELS}}'
          bom-include-mfr-mpn: '{{BOM_INCLUDE_MFR_MPN}}'

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: {{GITHUB_REF_NAME}}
          generate_release_notes: true
          files: {{OUTPUT_DIR}}/*
          overwrite: true
          overwrite_files: true
