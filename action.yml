# KiForge composite GitHub Action
#
# Runs the KiCad 10 exporter inside the official kicad/kicad Docker image.
# Inputs mirror kiforge.py configuration layers:
#   - export_* toggles  → EXPORT_SETTING_KEYS (what to produce)
#   - pos_*/step_*/render_* → EXPORT_PARAM_SPECS (kicad-cli parameters)
#   - sync_title_block_rev → RUNTIME_OPTION_SPECS (per-run behavior)
#
# action/run.sh maps INPUT_* env vars to the same CLI flags as `python kiforge.py`.
# See USAGE.md for workflow examples and the full input reference.
name: 'KiForge'
description: 'Export BOM, CPL, STEP, Gerbers, Drills, 3D renders, SVGs, and PDF from a KiCad 10 project using the official docker image'
author: 'alphaseneca'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  project_path:
    description: 'Relative path to the KiCad project directory (contains .kicad_pro)'
    required: true
    default: '.'
  output_dir:
    description: 'Directory inside the workspace where outputs will be saved (relative to project_path)'
    required: false
    default: 'kiforge'
  export_3d:
    description: 'Export 3D front/back renders (true/false)'
    required: false
    default: 'true'
  export_svg:
    description: 'Export copper layer SVGs (true/false)'
    required: false
    default: 'true'
  export_bom:
    description: 'Export Bill of Materials (true/false)'
    required: false
    default: 'true'
  export_sch_pdf:
    description: 'Export schematic PDF (true/false)'
    required: false
    default: 'true'
  export_pos:
    description: 'Export component placement file (true/false)'
    required: false
    default: 'true'
  export_step:
    description: 'Export STEP 3D model (true/false)'
    required: false
    default: 'true'
  export_gerbers:
    description: 'Export Gerber files (true/false)'
    required: false
    default: 'true'
  export_drills:
    description: 'Export Drill files (true/false)'
    required: false
    default: 'true'
  export_ibom:
    description: 'Export Interactive HTML BOM (true/false)'
    required: false
    default: 'true'
  format_jlc:
    description: 'Also produce JLC-ready BOM/CPL from KiCad CSV exports (true/false)'
    required: false
    default: 'true'
  pos_side:
    description: 'Placement export side: both, front (top), or back (bottom)'
    required: false
    default: 'both'
  pos_smd_only:
    description: 'Placement CSV includes SMD parts only (true/false)'
    required: false
    default: 'true'
  pos_exclude_dnp:
    description: 'Exclude DNP parts from placement CSV (true/false)'
    required: false
    default: 'true'
  step_subst_models:
    description: 'STEP export: substitute missing 3D models (true/false)'
    required: false
    default: 'true'
  bom_include_mfr_mpn:
    description: 'BOM/iBOM: include Manufacturer & MPN columns (true/false)'
    required: false
    default: 'true'
  sync_title_block_rev:
    description: 'Sync schematic title-block (rev) to export version via staged copy (true/false)'
    required: false
    default: 'true'
  version:
    description: 'Optional version tag override for output filenames (defaults to GITHUB_REF_NAME or v0.1.0)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run KiForge exporter
      shell: bash
      env:
        KIFORGE_ACTION_PATH: ${{ github.action_path }}
        KIFORGE_WORKSPACE: ${{ github.workspace }}
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_EXPORT_3D: ${{ inputs.export_3d }}
        INPUT_EXPORT_SVG: ${{ inputs.export_svg }}
        INPUT_EXPORT_BOM: ${{ inputs.export_bom }}
        INPUT_EXPORT_SCH_PDF: ${{ inputs.export_sch_pdf }}
        INPUT_EXPORT_POS: ${{ inputs.export_pos }}
        INPUT_EXPORT_STEP: ${{ inputs.export_step }}
        INPUT_EXPORT_GERBERS: ${{ inputs.export_gerbers }}
        INPUT_EXPORT_DRILLS: ${{ inputs.export_drills }}
        INPUT_EXPORT_IBOM: ${{ inputs.export_ibom }}
        INPUT_FORMAT_JLC: ${{ inputs.format_jlc }}
        INPUT_POS_SIDE: ${{ inputs.pos_side }}
        INPUT_POS_SMD_ONLY: ${{ inputs.pos_smd_only }}
        INPUT_POS_EXCLUDE_DNP: ${{ inputs.pos_exclude_dnp }}
        INPUT_STEP_SUBST_MODELS: ${{ inputs.step_subst_models }}
        INPUT_BOM_INCLUDE_MFR_MPN: ${{ inputs.bom_include_mfr_mpn }}
        INPUT_SYNC_TITLE_BLOCK_REV: ${{ inputs.sync_title_block_rev }}
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
      run: bash "${{ github.action_path }}/action/run.sh"
