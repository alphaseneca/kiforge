# KiForge composite GitHub Action
#
# Runs the KiCad 10 exporter inside the official kicad/kicad Docker image.
# Inputs mirror kiforge.py configuration layers:
#   - export-* toggles      → EXPORT_SETTING_KEYS (what to produce)
#   - pos-*/step-*/render-* → EXPORT_PARAM_SPECS (kicad-cli parameters)
#
# All inputs use kebab-case, matching CLI flags 1:1.
# action/run.sh maps INPUT_* environment variables to CLI flags for `python kiforge.py`.
# See USAGE.md for workflow examples and the full input reference.
name: 'KiForge'
description: 'Export BOM, CPL, STEP, Gerbers, Drills, 3D renders, SVGs, and PDF from a KiCad 10 project using the official docker image'
author: 'alphaseneca'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  project-path:
    description: 'Relative path to the KiCad project directory (contains .kicad_pro)'
    required: false
    default: '.'
  pcb-file:
    description: 'Path to specific .kicad_pcb board file (e.g. from .history or backup)'
    required: false
    default: ''
  output-dir:
    description: 'Directory inside the workspace where outputs will be saved (relative to project-path)'
    required: false
    default: 'kiforge'
  export-3d:
    description: 'Export 3D front/back renders (true/false)'
    required: false
    default: 'true'
  export-svg:
    description: 'Export copper layer SVGs (true/false)'
    required: false
    default: 'true'
  export-homebrew-pdf:
    description: 'Export 1200 DPI homebrew etching & mask PDF (true/false)'
    required: false
    default: 'true'
  export-bom:
    description: 'Export Bill of Materials (true/false)'
    required: false
    default: 'true'
  export-sch-pdf:
    description: 'Export schematic PDF (true/false)'
    required: false
    default: 'true'
  export-pos:
    description: 'Export component placement file (true/false)'
    required: false
    default: 'true'
  export-step:
    description: 'Export STEP 3D model (true/false)'
    required: false
    default: 'true'
  export-gerbers:
    description: 'Export Gerber files (true/false)'
    required: false
    default: 'true'
  export-drills:
    description: 'Export Drill files (true/false)'
    required: false
    default: 'true'
  export-ibom:
    description: 'Export Interactive HTML BOM (true/false)'
    required: false
    default: 'true'
  format-jlc:
    description: 'Also produce JLC-ready BOM/CPL from KiCad CSV exports (true/false)'
    required: false
    default: 'true'
  pos-side:
    description: 'Placement export side: both, front (top), or back (bottom)'
    required: false
    default: 'both'
  pos-smd-only:
    description: 'Placement CSV includes SMD parts only (true/false)'
    required: false
    default: 'true'
  pos-exclude-dnp:
    description: 'Exclude DNP parts from placement CSV (true/false)'
    required: false
    default: 'true'
  step-subst-models:
    description: 'STEP export: substitute missing 3D models (true/false)'
    required: false
    default: 'true'
  bom-include-mfr-mpn:
    description: 'BOM/iBOM: include Manufacturer & MPN columns (true/false)'
    required: false
    default: 'true'
  version:
    description: 'Optional version tag override for output filenames (defaults to GITHUB_REF_NAME or v0.1.0)'
    required: false
    default: ''
  kicad-version:
    description: 'KiCad Docker image version (minimum supported is 10.0; no upper cap, e.g. 10.0, 11.0, nightly)'
    required: false
    default: '10.0'

runs:
  using: 'composite'
  steps:
    - name: Run KiForge exporter
      shell: bash
      env:
        KIFORGE_ACTION_PATH: ${{ github.action_path }}
        KIFORGE_WORKSPACE: ${{ github.workspace }}
        INPUT_PROJECT_PATH: ${{ inputs['project-path'] }}
        INPUT_PCB_FILE: ${{ inputs['pcb-file'] }}
        INPUT_OUTPUT_DIR: ${{ inputs['output-dir'] }}
        INPUT_EXPORT_3D: ${{ inputs['export-3d'] }}
        INPUT_EXPORT_SVG: ${{ inputs['export-svg'] }}
        INPUT_EXPORT_HOMEBREW_PDF: ${{ inputs['export-homebrew-pdf'] }}
        INPUT_EXPORT_BOM: ${{ inputs['export-bom'] }}
        INPUT_EXPORT_SCH_PDF: ${{ inputs['export-sch-pdf'] }}
        INPUT_EXPORT_POS: ${{ inputs['export-pos'] }}
        INPUT_EXPORT_STEP: ${{ inputs['export-step'] }}
        INPUT_EXPORT_GERBERS: ${{ inputs['export-gerbers'] }}
        INPUT_EXPORT_DRILLS: ${{ inputs['export-drills'] }}
        INPUT_EXPORT_IBOM: ${{ inputs['export-ibom'] }}
        INPUT_FORMAT_JLC: ${{ inputs['format-jlc'] }}
        INPUT_POS_SIDE: ${{ inputs['pos-side'] }}
        INPUT_POS_SMD_ONLY: ${{ inputs['pos-smd-only'] }}
        INPUT_POS_EXCLUDE_DNP: ${{ inputs['pos-exclude-dnp'] }}
        INPUT_STEP_SUBST_MODELS: ${{ inputs['step-subst-models'] }}
        INPUT_BOM_INCLUDE_MFR_MPN: ${{ inputs['bom-include-mfr-mpn'] }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_KICAD_VERSION: ${{ inputs['kicad-version'] }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
      run: bash "${{ github.action_path }}/action/run.sh"
