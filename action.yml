name: 'KiForge'
description: 'Export BOM, CPL, STEP, Gerbers, Drills, 3D renders, SVGs, and PDF from a KiCad 10 project using the official docker image'
author: 'alphaseneca'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  project_path:
    description: 'Relative path to the KiCad project directory (contains .kicad_pro)'
    required: true
    default: '.'
  output_dir:
    description: 'Directory inside the workspace where outputs will be saved (relative to project_path)'
    required: false
    default: 'kiforge'
  export_3d:
    description: 'Export 3D front/back renders (true/false)'
    required: false
    default: 'true'
  export_svg:
    description: 'Export copper layer SVGs (true/false)'
    required: false
    default: 'true'
  export_bom:
    description: 'Export Bill of Materials (true/false)'
    required: false
    default: 'true'
  export_sch_pdf:
    description: 'Export schematic PDF (true/false)'
    required: false
    default: 'true'
  export_pos:
    description: 'Export component placement file (true/false)'
    required: false
    default: 'true'
  export_step:
    description: 'Export STEP 3D model (true/false)'
    required: false
    default: 'true'
  export_gerbers:
    description: 'Export Gerber files (true/false)'
    required: false
    default: 'true'
  export_drills:
    description: 'Export Drill files (true/false)'
    required: false
    default: 'true'
  export_ibom:
    description: 'Export Interactive HTML BOM (true/false)'
    required: false
    default: 'true'
  version:
    description: 'Version tag to append to filenames'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run KiForge Exporter
      shell: bash
      run: |
        ARGS=()
        ARGS+=("--project-path" "${{ inputs.project_path }}")
        ARGS+=("--output-dir" "${{ inputs.output_dir }}")
        
        if [ "${{ inputs.export_3d }}" = "false" ]; then ARGS+=("--no-export-3d"); fi
        if [ "${{ inputs.export_svg }}" = "false" ]; then ARGS+=("--no-export-svg"); fi
        if [ "${{ inputs.export_bom }}" = "false" ]; then ARGS+=("--no-export-bom"); fi
        if [ "${{ inputs.export_sch_pdf }}" = "false" ]; then ARGS+=("--no-export-sch-pdf"); fi
        if [ "${{ inputs.export_pos }}" = "false" ]; then ARGS+=("--no-export-pos"); fi
        if [ "${{ inputs.export_step }}" = "false" ]; then ARGS+=("--no-export-step"); fi
        if [ "${{ inputs.export_gerbers }}" = "false" ]; then ARGS+=("--no-export-gerbers"); fi
        if [ "${{ inputs.export_drills }}" = "false" ]; then ARGS+=("--no-export-drills"); fi
        if [ "${{ inputs.export_ibom }}" = "false" ]; then ARGS+=("--no-export-ibom"); fi
        if [ -n "${{ inputs.version }}" ]; then ARGS+=("--version-tag" "${{ inputs.version }}"); fi
        
        echo "Building KiForge Docker image..."
        docker build -t kiforge:latest "${{ github.action_path }}"

        echo "Running KiForge Exporter..."
        
        get_container_id() {
          # 1. Try hostname
          if [ -n "$(hostname)" ] && docker inspect "$(hostname)" &>/dev/null; then
            echo "$(hostname)"
            return 0
          fi
          
          # 2. Try cgroup
          if [ -f /proc/self/cgroup ]; then
            local cid
            cid=$(grep -o -E '[0-9a-f]{64}' /proc/self/cgroup 2>/dev/null | head -n 1)
            if [ -n "$cid" ] && docker inspect "$cid" &>/dev/null; then
              echo "$cid"
              return 0
            fi
          fi
          
          # 3. Try mountinfo
          if [ -f /proc/self/mountinfo ]; then
            local cid
            cid=$(grep -o -E '[0-9a-f]{64}' /proc/self/mountinfo 2>/dev/null | head -n 1)
            if [ -n "$cid" ] && docker inspect "$cid" &>/dev/null; then
              echo "$cid"
              return 0
            fi
          fi
          
          return 1
        }

        CONTAINER_ID=$(get_container_id || true)

        if [ -n "$CONTAINER_ID" ]; then
          echo "Detected running inside a Docker container ($CONTAINER_ID). Using --volumes-from..."
          docker run --rm \
            --user root \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -e VERSION \
            --volumes-from "$CONTAINER_ID" \
            -w "${{ github.workspace }}" \
            kiforge:latest \
            /bin/bash /action/kiforge.sh "${ARGS[@]}"
        else
          echo "Running on host or container ID not found. Using standard volume mount..."
          docker run --rm \
            --user root \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -e VERSION \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            kiforge:latest \
            /bin/bash /action/kiforge.sh "${ARGS[@]}"
        fi
          
        # Restore host user ownership on the output folder
        # This prevents permission issues in subsequent workflow steps
        if [ -d "${{ inputs.project_path }}/${{ inputs.output_dir }}" ]; then
          sudo chown -R $(id -u):$(id -g) "${{ inputs.project_path }}/${{ inputs.output_dir }}"
        fi
