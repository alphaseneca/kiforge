# Manufacturing release workflow for KiCad projects (GitHub Actions).
# Generated by KiForge (templates/github-release.yml). 

name: Manufacturing Release (GitHub)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiForge
        uses: alphaseneca/kiforge@main
        with:
          project_path: '.'
          output_dir: 'kiforge_out'
          export_3d: 'true'
          export_svg: 'true'
          export_bom: 'true'
          export_sch_pdf: 'true'
          export_pos: 'true'
          export_step: 'true'
          export_gerbers: 'true'
          export_drills: 'true'
          export_ibom: 'true'
          format_jlc: 'true'
          pos_side: 'both'
          pos_smd_only: 'true'
          pos_exclude_dnp: 'true'
          step_subst_models: 'true'
          sync_title_block_rev: 'true'

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: kiforge_out/*
          overwrite: true
          overwrite_files: true
