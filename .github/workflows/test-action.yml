# CI for KiForge: unit tests (no KiCad) and Docker composite-action integration.
name: Test KiForge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # KiForge only ever runs inside KiCad, which bundles its own Python -- 3.9.13
  # on macOS, newer 3.x elsewhere -- so the supported interpreter is a range,
  # not one build. This job imports every shipped module under a stand-in KiCad
  # runtime and asserts a toolbar button gets registered, across the whole
  # range and all three platforms. It needs no dependencies, so it can run
  # where the full suite would be guesswork, and it is what catches code that
  # parses everywhere but only *runs* on the newest interpreter.
  import-gate:
    name: KiCad load (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor and current: anything valid on both is valid in between.
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Import shipped modules under a stand-in KiCad runtime
        run: python tests/kicad_runtime_stub.py

  # Write-time enforcement of the same floor. ruff's FA102 flags PEP 604
  # (`X | None`) annotations in a module without `from __future__ import
  # annotations` -- valid syntax on the floor, TypeError when evaluated there.
  # Pinned to a known-good release so a new ruff cannot turn CI red on its own.
  lint:
    name: Compatibility lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Check interpreter compatibility rules
        run: ruff check .

  # The unit tests mock pip, so nothing verified that a real install actually
  # lands in the interpreter we aimed at. This does it for real, on every
  # platform: build a throwaway interpreter, install into *that* one, and check
  # the package became importable there and not here. Pillow only -- PyQt6 is a
  # ~100 MB download and exercises the same code path.
  renderer-install:
    name: PDF renderer install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: import-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a renderer into a target interpreter
        shell: python
        run: |
          import subprocess, sys, os, venv, pathlib

          target_dir = pathlib.Path("target-env").resolve()
          venv.create(target_dir, with_pip=True)
          bindir = "Scripts" if os.name == "nt" else "bin"
          exe = str(target_dir / bindir / ("python.exe" if os.name == "nt" else "python"))

          sys.path.insert(0, ".")
          import kiforge

          missing = kiforge.missing_pdf_renderer_packages(["Pillow"], python_exe=exe)
          assert missing == ["Pillow"], f"probe should see a bare venv as missing: {missing}"

          ok, message = kiforge.install_pdf_renderer(["Pillow"], python_exe=exe)
          assert ok, message
          print(message)

          after = kiforge.missing_pdf_renderer_packages(["Pillow"], python_exe=exe)
          assert after == [], f"still missing after install: {after}"

          # It must have landed in the target, not in the interpreter that ran this.
          probe = subprocess.run(
              [exe, "-c", "import PIL, sys; print(PIL.__file__)"],
              capture_output=True, text=True, check=True,
          )
          assert str(target_dir) in probe.stdout, probe.stdout
          print("landed in the target interpreter:", probe.stdout.strip())

      - name: Install a renderer into KiForge's own package directory
        shell: python
        run: |
          # The last rung of the ladder, for an externally-managed interpreter
          # that refuses every in-environment install (PEP 668). The rung
          # itself is unit-tested; what only a real run can check is that the
          # directory and the sys.path snippet agree on every platform.
          import subprocess, sys, pathlib

          sys.path.insert(0, ".")
          import kiforge

          package_dir = pathlib.Path("kiforge-packages").resolve()
          kiforge.get_package_dir = lambda: str(package_dir)

          flags = kiforge.pip_install_attempts(sys.executable)[-1]
          assert flags[0] == "--target", flags
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
               *flags, "Pillow"],
              check=True,
          )

          assert (package_dir / "PIL").is_dir(), sorted(p.name for p in package_dir.iterdir())

          # -s disables the user site, so the only thing that can satisfy this
          # import is the snippet's directory. The snippet appends rather than
          # inserts, so without it a copy already on the interpreter's own path
          # would answer and prove nothing.
          snippet = kiforge.package_dir_path_snippet() + "import PIL; print(PIL.__file__)"
          probe = subprocess.run([sys.executable, "-s", "-c", snippet],
                                 capture_output=True, text=True, check=True)
          assert str(package_dir) in probe.stdout, probe.stdout
          print("importable from KiForge's package directory:", probe.stdout.strip())

  unit-tests:
    name: Python unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [import-gate, lint]
    strategy:
      fail-fast: false
      matrix:
        # All three platforms. KiForge's only hard dependencies are KiCad's own
        # pcbnew and wx, and everything else it imports is the standard library,
        # so nothing here is platform-specific by design -- any failure on one
        # OS is a portability bug worth seeing rather than a reason to narrow
        # the matrix.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PDF renderer for export tests
        if: runner.os == 'Linux'
        # librsvg2-bin provides rsvg-convert, the headless SVG->PDF converter
        # used by export_svg_to_1200dpi_pdf's CLI tier (the same package the
        # project's Docker image installs). Without it a bare runner has no
        # working PDF tier at all -- PyQt6 is not installed and the wx tier
        # needs a running wx.App -- so every test that renders a real PDF
        # skips, and the export path ships covered only by mocks.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libegl1 libgl1

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integration:
    name: Composite action export
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiForge composite action on sample project
        uses: ./
        with:
          project_path: tests/sample_project
          output_dir: kiforge
          version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Verify export artifacts exist
        run: |
          set -euo pipefail
          OUT="tests/sample_project/kiforge"
          if [[ ! -d "$OUT" ]]; then
            echo "Expected output directory missing: $OUT" >&2
            exit 1
          fi
          file_count="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" -eq 0 ]]; then
            echo "No export files were produced in $OUT" >&2
            ls -la "$OUT" || true
            exit 1
          fi
          echo "Export produced $file_count file(s):"
          find "$OUT" -type f | sort

      - name: Upload exported files
        uses: actions/upload-artifact@v4
        with:
          name: kicad-exports
          path: tests/sample_project/kiforge/
          if-no-files-found: error
