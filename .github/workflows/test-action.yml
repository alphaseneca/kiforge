# CI for KiForge: unit tests (no KiCad) and Docker composite-action integration.
name: Test KiForge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integration:
    name: Composite action export
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiForge composite action on sample project
        uses: ./
        with:
          project_path: tests/sample_project
          output_dir: kiforge
          version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Verify export artifacts exist
        run: |
          set -euo pipefail
          OUT="tests/sample_project/kiforge"
          if [[ ! -d "$OUT" ]]; then
            echo "Expected output directory missing: $OUT" >&2
            exit 1
          fi
          file_count="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" -eq 0 ]]; then
            echo "No export files were produced in $OUT" >&2
            ls -la "$OUT" || true
            exit 1
          fi
          echo "Export produced $file_count file(s):"
          find "$OUT" -type f | sort

      - name: Upload exported files
        uses: actions/upload-artifact@v4
        with:
          name: kicad-exports
          path: tests/sample_project/kiforge/
          if-no-files-found: error
