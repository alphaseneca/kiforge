# CI for KiForge: lint, unit tests, and Docker composite-action integration.
name: Test KiForge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Compatibility lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Check interpreter compatibility rules
        run: ruff check .

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: KiCad runtime import gate
        run: python tests/kicad_runtime_stub.py

      - name: Install PDF renderer for export tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libegl1 libgl1

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test dynamic renderer installation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: python
        run: |
          import subprocess, sys, os, venv, pathlib

          target_dir = pathlib.Path("target-env").resolve()
          venv.create(target_dir, with_pip=True)
          bindir = "Scripts" if os.name == "nt" else "bin"
          exe = str(target_dir / bindir / ("python.exe" if os.name == "nt" else "python"))

          sys.path.insert(0, ".")
          import kiforge

          missing = kiforge.missing_pdf_renderer_packages(["Pillow"], python_exe=exe)
          assert missing == ["Pillow"], f"probe should see a bare venv as missing: {missing}"

          ok, message = kiforge.install_pdf_renderer(["Pillow"], python_exe=exe)
          assert ok, message
          print(message)

          after = kiforge.missing_pdf_renderer_packages(["Pillow"], python_exe=exe)
          assert after == [], f"still missing after install: {after}"

  integration:
    name: Composite action export
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run KiForge composite action on sample project
        uses: ./
        with:
          project_path: tests/sample_project
          output_dir: kiforge
          version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Verify export artifacts exist
        run: |
          set -euo pipefail
          OUT="tests/sample_project/kiforge"
          if [[ ! -d "$OUT" ]]; then
            echo "Expected output directory missing: $OUT" >&2
            exit 1
          fi
          file_count="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" -eq 0 ]]; then
            echo "No export files were produced in $OUT" >&2
            ls -la "$OUT" || true
            exit 1
          fi
          echo "Export produced $file_count file(s):"
          find "$OUT" -type f | sort

      - name: Upload exported files
        uses: actions/upload-artifact@v7
        with:
          name: kicad-exports
          path: tests/sample_project/kiforge/
          if-no-files-found: error
