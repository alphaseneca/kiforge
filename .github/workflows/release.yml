name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build versioned plugin package
        run: |
          python package_plugin.py --version "${{ github.ref_name }}"

      - name: Commit updated metadata.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git diff --cached --quiet || git commit -m "chore: update metadata.json for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/com.github.alphaseneca.kiforge-${{ github.ref_name }}.zip
