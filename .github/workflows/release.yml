# Build and publish KiForge plugin PCM assets on version tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF renderer for export tests
        # librsvg2-bin provides rsvg-convert, the headless SVG->PDF converter
        # used by export_svg_to_1200dpi_pdf's CLI tier (the same package the
        # project's Docker image installs). Without it a bare runner has no
        # working PDF tier at all -- PyQt6 is not installed and the wx tier
        # needs a running wx.App -- so every test that renders a real PDF
        # skips, and the export path ships covered only by mocks.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          # Tag pushes set GITHUB_REF_NAME=vX.Y.Z; tests expect local/default resolution.
          GITHUB_REF_TYPE: branch

      - name: Build versioned plugin package
        run: python package_plugin.py --version "${{ github.ref_name }}"

      - name: Verify PCM download hash chain
        run: python -c "from package_plugin import verify_release_pcm_artifacts; verify_release_pcm_artifacts('${{ github.ref_name }}')"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/com.github.alphaseneca.kiforge-${{ github.ref_name }}.zip
            dist/metadata.json
            dist/packages.json
            dist/repository.json
            dist/resources.zip
          overwrite: true
          overwrite_files: true
